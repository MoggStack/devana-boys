<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#fbfbf8" />
  <title>Devana Boys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Sans+Malayalam:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦟</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="fx"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-left">
      <div id="lives"></div>
      <div id="level">LEVEL 1</div>
    </div>
    <div id="scoreBox">
      <div id="score">0</div>
      <div id="best">BEST 0</div>
    </div>
    <div class="hud-right">
      <button id="muteBtn" class="icon-btn" title="Sound">🔊</button>
      <button id="pauseBtn" class="icon-btn dark" title="Pause (P)">❚❚</button>
    </div>
  </div>

  <!-- START -->
  <div id="startScreen" class="overlay">
    <div class="card">
      <h1>Devana Boys</h1>
      <div class="ml-title">🦟 Mosquito Hunt</div>
      <p class="sub">Irshad is asleep. The boys are flying in.<br />Tap to shoot them before they get across!</p>

      <button id="playBtn" class="btn big">▶ Play</button>
      <div class="hint">Best: <b id="menuBest">0</b> &nbsp;·&nbsp; P = pause &nbsp;·&nbsp; Don't shoot Irshad 😅</div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pauseScreen" class="overlay">
    <div class="card">
      <h2>Paused</h2>
      <button id="resumeBtn" class="btn big">▶ Resume</button>
      <div class="row">
        <button id="restartBtn" class="btn">↻ Restart</button>
        <button id="menuBtn" class="btn">☰ Menu</button>
      </div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="overScreen" class="overlay">
    <div class="card">
      <h2>He woke up 😠</h2>
      <div class="final"><span id="finalScore">0</span><small>mosquitos killed</small></div>
      <div id="newBest" class="new-best">🏆 NEW BEST!</div>
      <div class="hint">Best: <b id="finalBest">0</b></div>
      <button id="againBtn" class="btn big">↻ Play again</button>
      <button id="menuBtn2" class="link">main menu</button>
    </div>
  </div>

</div>

  <script src="vendor/gsap.min.js"></script>
  <script>window.gsap || document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"><\/script>')</script>
  <script src="js/manifest.js"></script>
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
